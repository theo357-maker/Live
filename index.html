<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🎓 Étudiant — Direct</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#fff;padding:16px}
.wrap{max-width:900px;margin:auto}.card{background:#182235;border:1px solid #334155;border-radius:18px;padding:18px;margin-bottom:16px}
h1{margin:0 0 8px;font-size:24px}.muted{color:#94a3b8}.row{display:flex;gap:10px;flex-wrap:wrap}
input,button{font:inherit;border-radius:10px;padding:12px 14px}input{flex:1;min-width:220px;background:#0b1220;color:#fff;border:1px solid #475569}
button{border:0;font-weight:700;cursor:pointer;background:#2563eb;color:#fff}button:disabled{opacity:.5;cursor:not-allowed}
.danger{background:#dc2626}.gray{background:#475569}.green{background:#16a34a}
video{width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;display:block;object-fit:contain}
.status{padding:12px;border-radius:10px;background:#243044;color:#cbd5e1;margin-top:12px}.ok{background:#12351f;color:#86efac}.err{background:#401b1b;color:#fca5a5}.wait{background:#3b2b0a;color:#fde68a}
#app{display:none}.login{max-width:430px;margin:80px auto;text-align:center}.small{font-size:13px}
.videoActions{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
</style>
</head>
<body>
<div id="login" class="card login">
<h1>🎓 Espace Étudiant</h1>
<p class="muted">Connectez-vous avec Google pour suivre un direct.</p>
<button id="loginBtn">🔑 Connexion Google</button>
<div id="loginError" class="small"></div>
</div>

<div id="app" class="wrap">
<div class="card">
<h1>🎓 Direct de la classe</h1>
<div id="user" class="muted"></div>
</div>

<div class="card">
<div class="row">
<input id="roomId" placeholder="ID de salle, ex: cours_test" autocomplete="off">
<button id="joinBtn">▶️ Rejoindre</button>
<button id="leaveBtn" class="danger" disabled>⏹️ Quitter</button>
</div>
<div id="status" class="status">Entrez l'ID de la salle.</div>
</div>

<div class="card">
<video id="remoteVideo" autoplay playsinline webkit-playsinline muted></video>
<div class="videoActions">
<button id="playBtn" class="green" disabled>▶️ Afficher la vidéo</button>
<button id="soundBtn" class="gray" disabled>🔊 Activer le son</button>
</div>
<p id="videoInfo" class="muted small">La vidéo du professeur apparaîtra ici après son acceptation.</p>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={
 apiKey:"AIzaSyBn7VIddclO7KtrXb5sibCr9SjVLjOy-qI",
 authDomain:"theo1d.firebaseapp.com",projectId:"theo1d",
 storageBucket:"theo1d.firebasestorage.app",messagingSenderId:"269629842962",
 appId:"1:269629842962:web:a80a12b04448fe1e595acb"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();

const RTC_CONFIG={
 iceCandidatePoolSize:10,
 bundlePolicy:"max-bundle",
 rtcpMuxPolicy:"require",
 iceServers:[
  {urls:["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302"]},
  {urls:"turn:openrelay.metered.ca:80",username:"openrelayproject",credential:"openrelayproject"},
  {urls:"turn:openrelay.metered.ca:443",username:"openrelayproject",credential:"openrelayproject"},
  {urls:"turn:openrelay.metered.ca:443?transport=tcp",username:"openrelayproject",credential:"openrelayproject"}
 ]
};

let pc=null,roomId=null,uid=null,roomRef=null,studentRef=null;
let unsubStudent=null,unsubProfCandidates=null;
let remoteStream=null,candidateQueue=[],seenCandidates=new Set();
let joining=false,approved=false,cleaning=false;

const $=id=>document.getElementById(id);
function status(m,t=""){ $("status").textContent=m;$("status").className="status "+t; }

function resetVideo(){
 remoteStream=null;
 $("remoteVideo").srcObject=null;
 $("remoteVideo").muted=true;
 $("playBtn").disabled=true;
 $("soundBtn").disabled=true;
 $("videoInfo").textContent="La vidéo du professeur apparaîtra ici après son acceptation.";
}

async function playRemote(){
 const video=$("remoteVideo");
 if(!video.srcObject)return false;
 try{
  await video.play();
  $("playBtn").disabled=false;
  $("videoInfo").textContent="🟢 Vidéo du professeur affichée.";
  return true;
 }catch(e){
  console.warn("Lecture vidéo bloquée:",e);
  $("videoInfo").textContent="🎥 Flux reçu. Appuyez sur « Afficher la vidéo ».";
  return false;
 }
}

async function addQueuedCandidates(){
 if(!pc?.remoteDescription)return;
 const q=[...candidateQueue];candidateQueue=[];
 for(const c of q){
  try{await pc.addIceCandidate(new RTCIceCandidate(c));}
  catch(e){console.warn("ICE professeur:",e);}
 }
}

async function leave(clearUI=true){
 cleaning=true;
 if(unsubStudent){unsubStudent();unsubStudent=null;}
 if(unsubProfCandidates){unsubProfCandidates();unsubProfCandidates=null;}
 candidateQueue=[];seenCandidates.clear();

 if(pc){try{pc.ontrack=null;pc.onicecandidate=null;pc.close()}catch(e){}pc=null;}

 if(roomRef&&uid){
  try{
   await roomRef.collection("students").doc(uid).delete();
  }catch(e){console.warn("Suppression demande:",e);}
 }

 roomId=null;uid=null;roomRef=null;studentRef=null;approved=false;
 resetVideo();

 if(clearUI){
  $("joinBtn").disabled=false;
  $("leaveBtn").disabled=true;
  status("Vous avez quitté le direct.");
 }
 cleaning=false;
}

async function join(){
 if(joining)return;
 const id=$("roomId").value.trim();
 const user=auth.currentUser;
 if(!id)return status("❌ Entrez un ID de salle.","err");
 if(!user)return;

 joining=true;
 $("joinBtn").disabled=true;

 try{
  await leave(false);

  roomId=id;uid=user.uid;
  roomRef=db.collection("salles").doc(roomId);
  const room=await roomRef.get();

  if(!room.exists)throw new Error("Cette salle n'existe pas.");
  const data=room.data();
  if(data.professor?.online!==true)throw new Error("Le professeur n'est pas en direct.");

  pc=new RTCPeerConnection(RTC_CONFIG);
  remoteStream=new MediaStream();
  $("remoteVideo").srcObject=remoteStream;

  pc.ontrack=async event=>{
   console.log("🎥 TRACK REÇU :",event.track.kind);

   if(!remoteStream)remoteStream=new MediaStream();
   if(!remoteStream.getTracks().some(t=>t.id===event.track.id))
    remoteStream.addTrack(event.track);

   $("remoteVideo").srcObject=remoteStream;
   $("playBtn").disabled=false;
   $("soundBtn").disabled=false;

   console.log("REMOTE TRACKS:",
    remoteStream.getTracks().map(t=>({
     kind:t.kind,enabled:t.enabled,readyState:t.readyState
    }))
   );

   const played=await playRemote();
   if(played)status("🎥 Vidéo du professeur reçue.","ok");
   else status("🎥 Flux reçu. Appuyez sur « Afficher la vidéo ».","wait");
  };

  pc.onicecandidate=e=>{
   if(!e.candidate)return;
   roomRef.collection("students").doc(uid)
   .collection("candidates").add(e.candidate.toJSON())
   .catch(e=>console.warn("ICE étudiant:",e));
  };

  pc.oniceconnectionstatechange=()=>{
   const s=pc?.iceConnectionState;
   console.log("Étudiant ICE:",s);
   if(s==="checking")status("🔄 Recherche d'une connexion vidéo...","wait");
   if(s==="connected"||s==="completed")status("🟢 Connexion WebRTC établie.","ok");
   if(s==="disconnected")status("⚠️ Connexion vidéo interrompue, tentative de récupération...","wait");
   if(s==="failed")status("❌ WebRTC n'a pas réussi à traverser le réseau. Le serveur TURN/réseau doit être disponible.","err");
  };

  pc.onconnectionstatechange=()=>{
   const s=pc?.connectionState;
   console.log("Étudiant PC:",s);
   if(s==="connected")status("🟢 Direct connecté.","ok");
   if(s==="failed")status("❌ Connexion WebRTC échouée.","err");
  };

  studentRef=roomRef.collection("students").doc(uid);

  // Les listeners sont installés AVANT l'offre.
  unsubStudent=studentRef.onSnapshot(async doc=>{
   if(!pc||!doc.exists||cleaning)return;
   const d=doc.data();

   if(d.rejected===true){
    status("❌ Votre demande a été refusée.","err");
    return;
   }

   if(d.approved===true&&!approved){
    approved=true;
    status("✅ Demande acceptée. Établissement de la vidéo...","wait");
   }

   if(d.answer?.sdp&&!pc.currentRemoteDescription){
    try{
     await pc.setRemoteDescription(new RTCSessionDescription(d.answer));
     await addQueuedCandidates();
     status("🔄 Réponse reçue. Connexion au flux...","wait");
    }catch(e){
     console.error("setRemoteDescription:",e);
     status("❌ Impossible d'appliquer la réponse vidéo.","err");
    }
   }
  });

  unsubProfCandidates=studentRef.collection("profCandidates").onSnapshot(snap=>{
   snap.docChanges().forEach(ch=>{
    if(ch.type!=="added"||!pc)return;
    const c=ch.doc.data();
    const key=JSON.stringify(c);
    if(seenCandidates.has(key))return;
    seenCandidates.add(key);

    if(pc.remoteDescription){
     pc.addIceCandidate(new RTCIceCandidate(c)).catch(e=>console.warn("ICE professeur:",e));
    }else{
     candidateQueue.push(c);
    }
   });
  });

  const offer=await pc.createOffer({
   offerToReceiveAudio:true,
   offerToReceiveVideo:true
  });
  await pc.setLocalDescription(offer);

  await studentRef.set({
   name:user.displayName||"Étudiant",
   email:user.email||"",
   uid:user.uid,
   joinedAt:firebase.firestore.FieldValue.serverTimestamp(),
   approved:false,
   rejected:false,
   offer:{
    type:pc.localDescription.type,
    sdp:pc.localDescription.sdp
   }
  },{merge:true});

  status("⏳ Demande envoyée. Attente de l'acceptation du professeur...","wait");
  $("leaveBtn").disabled=false;
 }catch(e){
  console.error(e);
  status("❌ "+(e.message||"Erreur inconnue"),"err");
  await leave(false);
  $("joinBtn").disabled=false;
  $("leaveBtn").disabled=true;
 }finally{
  joining=false;
 }
}

$("loginBtn").onclick=async()=>{
 try{
  const p=new firebase.auth.GoogleAuthProvider();
  p.setCustomParameters({prompt:"select_account"});
  await auth.signInWithPopup(p);
 }catch(e){$("loginError").textContent="❌ "+e.message;}
};

$("joinBtn").onclick=join;
$("leaveBtn").onclick=()=>leave(true);

$("playBtn").onclick=async()=>{
 const ok=await playRemote();
 if(ok)status("🟢 Vidéo affichée.","ok");
};

$("soundBtn").onclick=async()=>{
 const video=$("remoteVideo");
 if(!video.srcObject)return;
 video.muted=false;
 try{
  await video.play();
  $("soundBtn").textContent="🔊 Son activé";
  status("🔊 Son du professeur activé.","ok");
 }catch(e){
  video.muted=true;
  status("⚠️ iPhone a bloqué le son. Appuyez encore une fois.","wait");
 }
};

$("remoteVideo").addEventListener("click",async()=>{
 await playRemote();
});

auth.onAuthStateChanged(u=>{
 if(u){
  $("login").style.display="none";
  $("app").style.display="block";
  $("user").textContent=`Connecté : ${u.displayName||u.email}`;
 }else{
  $("login").style.display="block";
  $("app").style.display="none";
 }
});

window.addEventListener("pagehide",()=>{
 if(unsubStudent){unsubStudent();unsubStudent=null;}
 if(unsubProfCandidates){unsubProfCandidates();unsubProfCandidates=null;}
 if(pc){try{pc.close()}catch(e){}pc=null;}
});
</script>
</body>
</html>

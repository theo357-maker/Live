<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>👨‍🏫 Professeur — Direct (LiveKit)</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#fff;padding:16px}
.wrap{max-width:1100px;margin:auto}.card{background:#182235;border:1px solid #334155;border-radius:18px;padding:18px;margin-bottom:16px}
h1{margin:0 0 8px;font-size:24px}.muted{color:#94a3b8}.row{display:flex;gap:10px;flex-wrap:wrap}
input,button{font:inherit;border-radius:10px;padding:12px 14px}input{flex:1;min-width:220px;background:#0b1220;color:#fff;border:1px solid #475569}
button{border:0;font-weight:700;cursor:pointer;background:#16a34a;color:#fff}button:disabled{opacity:.5;cursor:not-allowed}
.danger{background:#dc2626}.blue{background:#2563eb}.gray{background:#475569}.green{background:#16a34a}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}video{width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;object-fit:cover;display:block}
.status{padding:12px;border-radius:10px;background:#243044;color:#cbd5e1;margin-top:12px}.ok{background:#12351f;color:#86efac}.err{background:#401b1b;color:#fca5a5}.wait{background:#3b2b0a;color:#fde68a}
.student{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px;border-bottom:1px solid #334155}.student:last-child{border:0}.name{font-weight:700}.small{font-size:12px;color:#94a3b8}
.login{max-width:430px;margin:80px auto;text-align:center}.empty{padding:25px;text-align:center;color:#64748b}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="login" class="card login">
<h1>👨‍🏫 Espace Professeur</h1>
<p class="muted">Connectez-vous pour lancer le direct.</p>
<button id="loginBtn">🔑 Connexion Google</button>
<div id="loginError" class="small"></div>
</div>

<div id="app" class="wrap" style="display:none">
<div class="card">
<h1>👨‍🏫 Direct de la classe (LiveKit)</h1>
<div id="user" class="muted"></div>
</div>

<div class="card">
<div class="row">
<input id="roomId" value="cours_test" placeholder="ID de salle">
<button id="startBtn">▶️ Lancer le direct</button>
<button id="stopBtn" class="danger" disabled>⏹️ Arrêter</button>
</div>
<div id="status" class="status">Prêt.</div>
</div>

<div class="grid">
<div class="card">
<video id="localVideo" autoplay playsinline muted></video>
<div class="row" style="margin-top:10px">
<button id="cameraBtn" class="gray" disabled>📷 Caméra</button>
<button id="micBtn" class="gray" disabled>🎤 Micro</button>
<button id="switchBtn" class="blue" disabled>🔄 Retourner</button>
</div>
</div>
<div class="card">
<h3>👥 Étudiants connectés</h3>
<div id="students"><div class="empty">Aucun étudiant.</div></div>
</div>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
<script>
const firebaseConfig={
 apiKey:"AIzaSyBn7VIddclO7KtrXb5sibCr9SjVLjOy-qI",
 authDomain:"theo1d.firebaseapp.com",projectId:"theo1d",
 storageBucket:"theo1d.firebasestorage.app",messagingSenderId:"269629842962",
 appId:"1:269629842962:web:a80a12b04448fe1e595acb"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();

// ===== Configuration LiveKit =====
const TOKEN_SERVER_ID = "theo-az31wf";

let room = null;
let isLive = false;
let currentFacingMode = "user"; // "user" = selfie, "environment" = arrière

const $=id=>document.getElementById(id);
function status(m,t=""){ $("status").textContent=m;$("status").className="status "+t; }

// ===== Obtention du token via le SDK LiveKit =====
async function fetchToken(roomName) {
    console.log("🔑 Demande de token pour la salle:", roomName);
    const tokenSource = LivekitClient.TokenSource.sandboxTokenServer(TOKEN_SERVER_ID);
    const { serverUrl, participantToken } = await tokenSource.fetch({ roomName });
    console.log("✅ Token obtenu, serveur:", serverUrl);
    return { token: participantToken, url: serverUrl };
}

// ===== Basculer entre caméra avant / arrière =====
async function switchCamera() {
    if (!room) return;
    
    const target = currentFacingMode === "user" ? "environment" : "user";
    console.log("🔄 Bascule vers caméra:", target);
    status("🔄 Recherche d'une caméra " + (target === "user" ? "frontale" : "arrière") + "...", "wait");

    try {
        // Récupérer la liste des périphériques vidéo
        const devices = await LivekitClient.Room.getLocalDevices('videoinput');
        
        if (!devices || devices.length === 0) {
            status("⚠️ Aucune caméra détectée.", "err");
            return;
        }

        console.log("📹 Caméras disponibles:", devices.map(d => d.label || d.deviceId));

        // Essayer de trouver une caméra correspondant au facingMode souhaité
        let targetDevice = null;

        // D'abord, chercher par label (mots-clés courants)
        const backKeywords = ["back", "rear", "arrière", "environment", "world"];
        const frontKeywords = ["front", "face", "avant", "user", "selfie"];

        for (const device of devices) {
            const label = (device.label || "").toLowerCase();
            if (target === "environment") {
                if (backKeywords.some(k => label.includes(k))) {
                    targetDevice = device;
                    break;
                }
            } else {
                if (frontKeywords.some(k => label.includes(k))) {
                    targetDevice = device;
                    break;
                }
            }
        }

        // Si on n'a pas trouvé par label, on prend le premier device différent de l'actuel
        if (!targetDevice) {
            const currentPub = room.localParticipant.getTrackPublication(LivekitClient.Track.Source.Camera);
            const currentDeviceId = currentPub?.track?.mediaStreamTrack?.getSettings()?.deviceId;
            
            targetDevice = devices.find(d => d.deviceId !== currentDeviceId);
            if (!targetDevice) targetDevice = devices[0];
        }

        console.log("🎯 Caméra cible:", targetDevice.label || targetDevice.deviceId);

        // Utiliser la méthode du SDK LiveKit pour changer de caméra
        await room.switchActiveDevice('videoinput', targetDevice.deviceId);
        
        currentFacingMode = target;
        status("🟢 Caméra basculée vers : " + (target === "user" ? "Selfie" : "Arrière"), "ok");
        
        // Mettre à jour le texte du bouton
        $("switchBtn").textContent = target === "user" ? "🔄 Passer à l'arrière" : "🔄 Passer au selfie";

    } catch (e) {
        console.error("❌ Erreur switchCamera:", e);
        status("❌ Impossible de basculer : " + e.message, "err");
    }
}

async function startLive(){
 if(isLive) return;
 const id = $("roomId").value.trim();
 if(!id) throw new Error("ID de salle requis.");
 const user = auth.currentUser;
 if(!user) throw new Error("Vous devez être connecté.");

 status("🔄 Demande de token LiveKit...", "wait");

 try {
   // 1. Récupérer le token
   const { token, url } = await fetchToken(id);

   // 2. Créer la salle
   room = new LivekitClient.Room({
     adaptiveStream: true,
     dynacast: true,
   });

   // 3. Écouter les participants
   room.on(LivekitClient.RoomEvent.ParticipantConnected, (participant) => {
     console.log("👤 Étudiant connecté:", participant.identity);
     updateStudentsList();
   });

   room.on(LivekitClient.RoomEvent.ParticipantDisconnected, (participant) => {
     console.log("👤 Étudiant déconnecté:", participant.identity);
     updateStudentsList();
   });

   room.on(LivekitClient.RoomEvent.Disconnected, () => {
     console.log("🔌 Déconnecté de LiveKit");
     if (isLive) status("⚠️ Connexion LiveKit perdue.", "err");
   });

   // 4. Se connecter
   status("🔄 Connexion à la salle LiveKit...", "wait");
   await room.connect(url, token);
   console.log("✅ Connecté à la salle");

   // 5. Activer caméra et micro
   await room.localParticipant.enableCameraAndMicrophone();
   console.log("✅ Caméra et micro activés");

   // 6. Afficher la vidéo locale
   const videoEl = $("localVideo");
   const camPub = room.localParticipant.getTrackPublication(LivekitClient.Track.Source.Camera);
   if (camPub && camPub.track) {
     camPub.track.attach(videoEl);
   }

   // Réattacher si de nouvelles pistes sont publiées
   room.on(LivekitClient.RoomEvent.LocalTrackPublished, (pub) => {
     if (pub.source === LivekitClient.Track.Source.Camera && pub.track) {
       pub.track.attach(videoEl);
     }
   });

   isLive = true;
   $("startBtn").disabled = true;
   $("stopBtn").disabled = false;
   $("cameraBtn").disabled = false;
   $("micBtn").disabled = false;
   $("switchBtn").disabled = false;
   status("🟢 DIRECT LANCÉ — Salle : " + id, "ok");
   updateStudentsList();

 } catch(e) {
   console.error("❌ Erreur startLive:", e);
   status("❌ " + (e.message || "Erreur inconnue"), "err");
   if(room) { try{ await room.disconnect(); }catch(_){} room = null; }
   $("startBtn").disabled = false;
   $("stopBtn").disabled = true;
   $("switchBtn").disabled = true;
 }
}

function updateStudentsList(){
  if(!room){
    $("students").innerHTML='<div class="empty">Aucun étudiant.</div>';
    return;
  }
  const participants = Array.from(room.remoteParticipants.values());
  if(!participants.length){
    $("students").innerHTML='<div class="empty">Aucun étudiant.</div>';
    return;
  }
  $("students").innerHTML = participants.map(p => `
    <div class="student">
      <div>
        <div class="name">${p.identity || "Étudiant"}</div>
        <div class="small">${p.name || ""}</div>
      </div>
      <div>🟢</div>
    </div>
  `).join('');
}

async function stopLive(){
 if(!room && !isLive) return;
 status("⏹️ Arrêt en cours...", "wait");

 if(room){
   try { await room.disconnect(); } catch(e){ console.warn(e); }
   room = null;
 }

 isLive = false;
 $("localVideo").srcObject = null;
 $("startBtn").disabled = false;
 $("stopBtn").disabled = true;
 $("cameraBtn").disabled = true;
 $("micBtn").disabled = true;
 $("switchBtn").disabled = true;
 $("cameraBtn").textContent = "📷 Caméra";
 $("micBtn").textContent = "🎤 Micro";
 $("switchBtn").textContent = "🔄 Retourner";
 currentFacingMode = "user";
 $("students").innerHTML='<div class="empty">Aucun étudiant.</div>';
 status("⏹️ Direct arrêté.");
}

$("loginBtn").onclick=async()=>{
 try{
  const p=new firebase.auth.GoogleAuthProvider();
  p.setCustomParameters({prompt:"select_account"});
  await auth.signInWithPopup(p);
 }catch(e){$("loginError").textContent="❌ "+e.message;}
};

$("startBtn").onclick=async()=>{try{await startLive()}catch(e){console.error(e);status("❌ "+e.message,"err")}};
$("stopBtn").onclick=stopLive;

$("cameraBtn").onclick=()=>{
 if(!room) return;
 const pub = room.localParticipant.getTrackPublication(LivekitClient.Track.Source.Camera);
 if(pub && pub.track){
   pub.track.enabled = !pub.track.enabled;
   $("cameraBtn").textContent = pub.track.enabled ? "📷 Caméra" : "📷 Caméra OFF";
 }
};
$("micBtn").onclick=()=>{
 if(!room) return;
 const pub = room.localParticipant.getTrackPublication(LivekitClient.Track.Source.Microphone);
 if(pub && pub.track){
   pub.track.enabled = !pub.track.enabled;
   $("micBtn").textContent = pub.track.enabled ? "🎤 Micro" : "🎤 Micro OFF";
 }
};

$("switchBtn").onclick=switchCamera;

auth.onAuthStateChanged(u=>{
 if(u){
  $("login").style.display="none";$("app").style.display="block";
  $("user").textContent=`Connecté : ${u.displayName||u.email}`;
 }else{
  $("login").style.display="block";$("app").style.display="none";
 }
});

window.addEventListener("pagehide",()=>{
 if(room){ try{ room.disconnect(); }catch(e){} }
});
</script>
</body>
</html>
